<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Park Printing Solutions – Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="./js/web.js" type="text/javascript"></script>
  <script src="./js/login.js" type="text/javascript"></script>
  <script src="./js/nav.js" type="text/javascript"></script>
  <script src="./js/index.js" type="text/javascript"></script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      --accent: #007aff;
      --bg-gradient: linear-gradient(135deg,#eceef3 0%,#f7f8fa 100%);
      --border: #dde1e6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-gradient);
    }

    /* ───── Login Card ───── */
    .login-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      animation: fadeUp .6s ease forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card h1 {
      font-size: 1.6rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
    }

    .form-group { position: relative; margin-top: 1.35rem; }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: #555;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      font-size: 0.95rem;
      transition: border-color .2s, box-shadow .2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
      outline: none;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 1rem;
      transform: translateY(-50%);
      font-size: 1.1rem;
      cursor: pointer;
      color: #8a8a8a;
      user-select: none;
    }

    button.login-btn {
      width: 100%;
      margin-top: 2rem;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 0.75rem;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }

    button.login-btn:hover { background: #0066e0; }
    button.login-btn:active { transform: scale(0.98); }

    .links {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.85rem;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    /* Small devices */
    @media (max-width: 420px) {
      .login-card { margin: 0 1rem; }
    }
  </style>
</head>
<body>
  <main class="login-card" role="main">
    <center>
      <image src="./logos/park.png" style="width: 200px;"></image>
    </center>
    <br>
    <label id="login-error"></label>
    <form onsubmit="return false;">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="username_field" placeholder="you@parkprinting.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password_field" placeholder="••••••••" required />
        <span class="toggle-password" onclick="togglePassword()">👁️</span>
      </div>

      <button type="submit" class="login-btn" onclick="login_clicked();">Log In</button>

      <div class="links">
        <a onclick="forgotPassword();" style="cursor: pointer;">Forgot password?</a>
      </div>
    </form>
  </main>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
